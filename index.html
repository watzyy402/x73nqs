<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="edge-loader" content="1">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>EDGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* ---------- lock screen ---------- */
@property --lka{syntax:'<angle>';inherits:false;initial-value:0deg}
#lock{--tk:1;--sig:#3fe39a;--bad:#ff6b70;--lkr:196,203,214;position:fixed;inset:0;z-index:100;background:var(--lk,#0a0b0d);color:#eef0f3;display:flex;flex-direction:column;align-items:center;padding:calc(54px + env(safe-area-inset-top)) 22px max(16px,env(safe-area-inset-bottom));overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;isolation:isolate}
[data-theme=purple] #lock{--lkr:139,92,246}
[data-theme=blue] #lock{--lkr:59,130,246}
#lock.opening{pointer-events:none}
#lock.relock{animation:lkF2 .4s ease-out}
@keyframes lkF2{from{opacity:0}to{opacity:1}}

/* background: light, grid, line, grain */
.lk-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lk-aur{position:absolute;inset:0;opacity:0}
.lk-aur::before,.lk-aur::after{content:'';position:absolute;border-radius:50%;will-change:transform}
.lk-aur::before{width:120vmax;height:120vmax;left:50%;top:34%;margin:-60vmax 0 0 -60vmax;background:radial-gradient(closest-side,rgba(var(--lkr),.17),rgba(var(--lkr),.05) 55%,transparent 76%);animation:lkDriftA 24s ease-in-out infinite alternate}
.lk-aur::after{width:90vmax;height:90vmax;right:-38vmax;bottom:-46vmax;background:radial-gradient(closest-side,rgba(var(--lkr),.10),transparent 72%);animation:lkDriftB 30s ease-in-out infinite alternate}
@keyframes lkDriftA{to{transform:translate3d(6vmax,4vmax,0) scale(1.08)}}
@keyframes lkDriftB{to{transform:translate3d(-8vmax,-5vmax,0) scale(1.15)}}
.go .lk-aur{animation:lkF 2.4s calc(.1s*var(--tk)) forwards}
.lk-grid{position:absolute;inset:-2px;opacity:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(64% 52% at 50% 38%,#000 10%,transparent 76%);mask-image:radial-gradient(64% 52% at 50% 38%,#000 10%,transparent 76%)}
.go .lk-grid{animation:lkF 2s calc(.2s*var(--tk)) forwards}
.lk-line{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lk-line .ln{fill:none;stroke:#e9ecf1;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:.5}
.lk-line .ln.g{stroke-width:8;opacity:.08}
.lk-line .ar{opacity:0}
.go .lk-line .ln{animation:draw 2.8s calc(.5s*var(--tk)) cubic-bezier(.55,0,.2,1) forwards}
.go .lk-line .ar{animation:lkF 2.4s calc(1.1s*var(--tk)) forwards}
.lk-dot{position:absolute;left:0;top:0;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.12),0 0 16px rgba(255,255,255,.65);offset-rotate:0deg;offset-distance:0%;opacity:0}
.lk-dot::after{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.6);opacity:0}
.go .lk-dot{animation:lkTip 2.8s calc(.5s*var(--tk)) cubic-bezier(.55,0,.2,1) forwards}
.go .lk-dot::after{animation:lkDotP 2.6s calc(3.4s*var(--tk)) ease-out infinite}
@keyframes lkTip{from{offset-distance:0%;opacity:1}to{offset-distance:100%;opacity:1}}
@keyframes lkDotP{0%{opacity:.7;transform:scale(1)}80%,100%{opacity:0;transform:scale(4)}}
.lk-vig{position:absolute;inset:0;background:radial-gradient(130% 95% at 50% 36%,transparent 42%,rgba(0,0,0,.62))}
.lk-grain{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:.055;background-image:var(--noise,none);background-size:128px 128px}
@keyframes lkF{to{opacity:1}}

/* generic reveal used by the small pieces */
.lk-r{opacity:0}
.go .lk-r{animation:lkR .9s calc(var(--rd,0s)*var(--tk)) cubic-bezier(.16,1,.3,1) forwards}
.go .lk-r.f{animation-name:lkF}
@keyframes lkR{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.lk-meta{position:absolute;z-index:3;top:max(16px,env(safe-area-inset-top));left:22px;right:22px;display:flex;justify-content:space-between;align-items:center;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:#707784;pointer-events:none;font-variant-numeric:tabular-nums}
.lk-meta i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sig);margin-right:9px;box-shadow:0 0 10px var(--sig);animation:breathe 2.6s ease-in-out infinite}

.lk-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;margin:auto 0;flex:none;transition:opacity .3s,transform .45s cubic-bezier(.16,1,.3,1)}

/* the seal: E mark inside a 72-tick bezel */
.lk-seal{--ss:150px;position:relative;width:var(--ss);height:var(--ss);display:block;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;transition:transform .6s cubic-bezier(.16,1,.3,1)}
.lk-seal svg{position:relative;display:block;width:100%;height:100%;overflow:visible}
.lk-seal::before{content:'';position:absolute;inset:-40%;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--lkr),.26),rgba(var(--lkr),.07) 55%,transparent 72%);opacity:0;pointer-events:none}
.go .lk-seal::before{animation:lkF 1.6s calc(1s*var(--tk)) forwards,breathe 7s calc(2.8s*var(--tk)) ease-in-out infinite}
.lk-pl{position:absolute;inset:6%;border-radius:50%;border:1px solid rgba(255,255,255,.16);opacity:0;pointer-events:none}
.go .lk-pl{animation:lkPl 5.6s calc((1.45s + var(--j)*1.85s)*var(--tk)) cubic-bezier(.2,.6,.3,1) infinite}
@keyframes lkPl{0%{opacity:.5;transform:scale(.92)}62%,100%{opacity:0;transform:scale(3.4)}}
.sl-in{fill:none;stroke:rgba(255,255,255,.09);stroke-width:1}
.sl-arc{fill:none;stroke:var(--sig);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:118 360;opacity:0;transform-origin:100px 100px;transform:rotate(-90deg);transition:opacity .25s}
.sl-halo{opacity:.3}
.sl-t{--tc:rgba(255,255,255,.24);stroke:var(--tc);stroke-width:1.5;stroke-linecap:round;transition:stroke .18s}
.sl-t.mj{--tc:rgba(255,255,255,.52);stroke-width:2}
.sl-t.on{stroke:#fff}
.eb{fill:#f4f5f7;transform-box:fill-box;transition:fill .3s}
.eb.b1,.eb.b2,.eb.b3{transform-origin:0 50%}
.eb.s{transform-origin:50% 0}
.en{fill:var(--sig);transform-box:fill-box;transform-origin:0 100%}
.go .sl-t{animation:lkTick .55s calc((.12s + var(--i)*9ms)*var(--tk)) ease-out backwards}
@keyframes lkTick{0%{opacity:0;stroke:#fff}32%{opacity:1;stroke:#fff}100%{opacity:1;stroke:var(--tc)}}
.go .eb.s{animation:lkStem .5s calc(.55s*var(--tk)) cubic-bezier(.2,.9,.2,1) backwards}
.go .eb.b1{animation:lkBar .5s calc(.75s*var(--tk)) cubic-bezier(.2,.9,.2,1) backwards}
.go .eb.b2{animation:lkBar .5s calc(.85s*var(--tk)) cubic-bezier(.2,.9,.2,1) backwards}
.go .eb.b3{animation:lkBar .5s calc(.95s*var(--tk)) cubic-bezier(.2,.9,.2,1) backwards}
.go .en{animation:lkNotch .6s calc(1.1s*var(--tk)) cubic-bezier(.3,1.5,.4,1) backwards}
.go .sl-halo{animation:lkHalo 1.8s calc(1.1s*var(--tk)) ease-out backwards}
.go .lk-seal svg{animation:lkClick .55s calc(1.1s*var(--tk)) cubic-bezier(.3,1.6,.4,1) backwards}
@keyframes lkStem{from{transform:scale(1,0)}}
@keyframes lkBar{from{transform:scale(0,1)}}
@keyframes lkNotch{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes lkHalo{0%{opacity:0}18%{opacity:.95}100%{opacity:.3}}
@keyframes lkClick{from{transform:scale(.955)}}
/* wordmark + tagline */
.lk-title{margin:24px 0 0 .3em;font:800 clamp(42px,12.2vw,60px)/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.3em;opacity:0}
.lk-title span{display:block;min-height:1em;background:linear-gradient(180deg,#fff 8%,#98a0ad 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.go .lk-title{opacity:1;transition:opacity .25s calc(1.2s*var(--tk))}
.lk-sub{margin:14px 0 0;font:500 12.5px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:#8d949f;opacity:0;white-space:nowrap}
.go .lk-sub{opacity:1;transition:opacity .25s calc(1.85s*var(--tk))}
.lk-quote{margin-top:24px;display:flex;align-items:center;gap:14px;width:min(92vw,392px)}
.lk-quote .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3));transform:scaleX(0);transform-origin:right}
.lk-quote .ln:last-child{background:linear-gradient(270deg,transparent,rgba(255,255,255,.3));transform-origin:left}
.go .lk-quote .ln{animation:lkLn .9s calc(2.1s*var(--tk)) cubic-bezier(.16,1,.3,1) forwards}
@keyframes lkLn{to{transform:none}}
.lk-quote p{margin:0;text-align:center;font-size:15.5px;line-height:1.45;font-weight:600;letter-spacing:.005em}
.lk-quote p span{display:block;width:fit-content;margin:0 auto;clip-path:inset(-4px 100% -4px 0)}
.lk-quote p span:first-child{color:#eceef1}.lk-quote p span:last-child{color:#8f95a0}
.go .lk-quote p span{animation:lkWipe .85s calc((2.15s + var(--k)*.4s)*var(--tk)) cubic-bezier(.65,0,.2,1) forwards}
@keyframes lkWipe{to{clip-path:inset(-4px 0 -4px 0)}}

/* panel */
.lk-card{position:relative;width:min(92vw,392px);margin-top:26px;padding:22px 20px 20px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.028));-webkit-backdrop-filter:blur(22px) saturate(1.25);backdrop-filter:blur(22px) saturate(1.25);box-shadow:0 44px 90px -44px #000,inset 0 1px 0 rgba(255,255,255,.09);text-align:left}
.lk-card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:conic-gradient(from var(--lka,0deg),rgba(255,255,255,0) 0 58%,rgba(255,255,255,.7) 80%,rgba(255,255,255,0) 100%),linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:lkBeam 9s linear infinite}
@keyframes lkBeam{to{--lka:360deg}}
.lk-card.swap>*{animation:lkSwap .45s cubic-bezier(.16,1,.3,1) backwards}
@keyframes lkSwap{from{opacity:0;transform:translateY(8px)}}
.lk-hello{font-size:15px;color:#aab0ba;margin:0 0 16px;line-height:1.45}
.lk-hello b{display:block;color:#fff;font-weight:700;font-size:18px;letter-spacing:-.01em;margin-bottom:3px}
.lk-hello span{display:block}
.lk-row{position:relative;margin-bottom:12px}
.lk-row::after{content:'';position:absolute;left:20px;right:20px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);transform:scaleX(0);opacity:0;transition:transform .55s cubic-bezier(.16,1,.3,1),opacity .3s;pointer-events:none}
.lk-row:focus-within::after{transform:scaleX(1);opacity:1}
.lk-lab{display:block;font-size:12.5px;color:#8d949f;margin:0 0 7px 2px;font-weight:600}
.lk-in{width:100%;height:56px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#fff;padding:0 16px;font-size:17px;outline:0;transition:border-color .25s,background .25s,box-shadow .25s}
.lk-in::placeholder{color:#656c78}
.lk-in:focus{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.065);box-shadow:0 0 0 4px rgba(255,255,255,.06)}
.lk-in.bad{border-color:rgba(255,107,112,.7);box-shadow:0 0 0 4px rgba(255,107,112,.13)}
.lk-row.ic .lk-in{padding-left:50px}
.lk-ic{position:absolute;left:16px;bottom:17px;width:22px;height:22px;color:#7b8290;pointer-events:none;transition:color .3s}
.lk-row:focus-within .lk-ic{color:#fff}
.lk-ic svg{width:22px;height:22px;display:block;overflow:visible}
.lk-ic .shk{transform-origin:8px 11px;transition:transform .45s cubic-bezier(.3,1.6,.4,1)}
.ok .lk-ic .shk{transform:translateY(-3.2px) rotate(-22deg)}
.lk-eye{position:absolute;right:6px;bottom:6px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#7b8290;transition:color .2s}
.lk-eye:hover,.lk-eye:active{color:#fff}
.lk-btn{position:relative;width:100%;height:56px;border-radius:16px;margin-top:6px;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,#f5f6f8,#c8cdd5);color:#0b0c0f;font-weight:800;font-size:16px;letter-spacing:.01em;display:grid;place-items:center;box-shadow:inset 0 1px 0 #fff,0 14px 34px -14px rgba(255,255,255,.4);transition:transform .3s cubic-bezier(.16,1,.3,1),background .45s,box-shadow .45s}
.lk-btn::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.95) 50%,transparent 66%);transform:translateX(-130%);animation:lkShine 6s calc(3.8s*var(--tk)) ease-in-out infinite}
@keyframes lkShine{0%{transform:translateX(-130%)}28%,100%{transform:translateX(130%)}}
.lk-btn:active{transform:scale(.985)}
.lk-btn>*{grid-area:1/1;transition:opacity .25s,transform .4s cubic-bezier(.16,1,.3,1)}
.lk-btn .bs{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(11,12,15,.16);border-top-color:#0b0c0f;opacity:0;transform:scale(.6);animation:spin .75s linear infinite}
.lk-btn .bk{width:26px;height:26px;opacity:0;transform:scale(.5)}
.lk-btn .bk path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .4s .12s}
.lk-btn.busy{pointer-events:none}
.lk-btn.busy .bl{opacity:0;transform:translateY(-14px)}
.lk-btn.busy .bs{opacity:1;transform:none}
.ok .lk-btn{background:linear-gradient(180deg,#5cf0ad,#2fcf86);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 14px 40px -12px rgba(63,227,154,.7)}
.ok .lk-btn .bs{opacity:0}.ok .lk-btn .bl{opacity:0;transform:translateY(-14px)}
.ok .lk-btn .bk{opacity:1;transform:none}.ok .lk-btn .bk path{stroke-dashoffset:0}
.lk-err{min-height:20px;margin-top:12px;font-size:13.5px;line-height:1.35;color:#ff8a8e;text-align:center}
.lk-err.on{animation:lkSwap .35s ease-out}
.lk-foot{margin:18px 0 0;max-width:330px;font-size:12.5px;line-height:1.45;color:#6a717d;display:flex;gap:9px;align-items:flex-start;text-align:left}
.lk-foot svg{flex:none;margin-top:1px;color:#8d949f}
.lk-credit{position:relative;z-index:2;flex:none;padding-top:20px;font-size:13px;color:#6a717d}
.lk-credit b{font-family:'JetBrains Mono',monospace;font-weight:700;color:#b4b9c1;letter-spacing:.1em;margin-left:4px}
#lock .plan.best{border-color:rgba(255,255,255,.55)}
#lock .plan .tg{background:#f3f4f6;color:#111214}
.lk-shock{position:fixed;z-index:102;border-radius:50%;pointer-events:none;border:1.5px solid rgba(255,255,255,.7);box-shadow:0 0 38px rgba(255,255,255,.35),inset 0 0 38px rgba(255,255,255,.16);transform:translate(-50%,-50%)}
#app.iris{position:relative;z-index:101;background:var(--bg);min-height:100vh;min-height:100dvh}
#app.arrive .top,#app.arrive .hero,#app.arrive .grid>.card,#app.arrive .credit{animation:lkArr .8s calc(.1s + var(--i,0)*55ms) cubic-bezier(.16,1,.3,1) backwards}
@keyframes lkArr{from{opacity:0;transform:translateY(16px)}}
/* skip / quick: show the finished screen at once */
#lock.fast .lk-r{opacity:1;transform:none;animation:none}
#lock.fast .lk-title,#lock.fast .lk-sub{opacity:1;transition:none}
#lock.fast .lk-quote .ln{transform:none;animation:none}
#lock.fast .lk-quote p span{clip-path:none;animation:none}
#lock.fast .lk-line .ln,#lock.fast .lk-line .ar{animation:none;stroke-dashoffset:0}
#lock.fast .lk-line .ar{opacity:1}
#lock.fast .lk-dot{animation:none;offset-distance:100%;opacity:1}
#lock.fast .lk-aur,#lock.fast .lk-grid{animation:none;opacity:1}
#lock.fast .lk-seal::before{opacity:1;animation:breathe 7s ease-in-out infinite}
#lock.fast .sl-t,#lock.fast .eb,#lock.fast .en,#lock.fast .sl-halo,#lock.fast .lk-seal svg{animation:none}
#lock.fast.relock .sl-t{animation:lkTick .5s calc(var(--i)*5ms) ease-out backwards}
/* seal states (after the .fast block so they win) */
#lock.busy .sl-arc{opacity:1;animation:lkSpin .95s linear infinite}
@keyframes lkSpin{to{transform:rotate(270deg)}}
#lock.busy .sl-t{opacity:.55}
#lock.err .sl-t{animation:lkErrT .9s ease-out}
@keyframes lkErrT{0%,35%{stroke:var(--bad);stroke-width:2.6}100%{stroke:var(--tc)}}
#lock.ok .sl-t{animation:lkOkT .5s calc(var(--i)*6ms) ease-out both}
@keyframes lkOkT{0%{stroke:rgba(255,255,255,.3)}40%{stroke:#fff;stroke-width:2.8}100%{stroke:var(--sig);stroke-width:1.9}}
#lock.ok .sl-arc{opacity:0;animation:none}
#lock.ok .eb{fill:#fff}
#lock.ok .en{animation:lkNotchOk .6s .15s ease-out both}
@keyframes lkNotchOk{0%{transform:scale(1)}40%{transform:scale(1.7)}100%{transform:scale(1.15)}}
#lock.opening .lk-seal{transform:scale(1.16)}
#lock.opening .lk-wrap>:not(.lk-seal),#lock.opening .lk-credit,#lock.opening .lk-meta{opacity:0!important;transform:translateY(12px)!important;transition:opacity .28s,transform .4s!important}
#lock.opening .lk-pl{animation:none;opacity:0}

@keyframes fadeIn{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw2{to{stroke-dashoffset:0}}

/* ---------- entrance v8: pure black, a 3D scene, the tagline, the Discord line ---------- */
#lock{background:#000}
.lk-bg canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
.lk-bg #entH{width:262px;height:262px;transform-origin:50% 50%;will-change:transform}
.lk-vig{background:radial-gradient(125% 92% at 50% 14%,transparent 46%,rgba(0,0,0,.72))}
.lk-grain{opacity:.03}
.lk-aur,.lk-grid,.lk-line,.lk-dot{display:none}

/* the seal stays as the status light: a quiet ring of ticks around the hole. It still lights up while you type,
   spins while it checks, flashes on an error and turns green when you are in. */
.lk-seal{--ss:164px}
.lk-seal::before,.lk-pl,.sl-halo,.sl-in,.eb,.en{display:none}
.sl-t{--tc:rgba(255,255,255,.12)}
.sl-t.mj{--tc:rgba(255,255,255,.26)}
@media(max-height:740px){.lk-seal{--ss:126px}.lk-title{margin-top:14px}.lk-card{margin-top:18px}}
@media(min-width:700px){.lk-seal{--ss:184px}}

/* wordmark + tagline */
.lk-title{margin-top:20px}
.lk-sub{margin:14px 0 0;max-width:min(92vw,372px);white-space:normal;font:500 clamp(10.5px,3.05vw,12.5px)/1.55 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.04em;color:#aeb4bf;opacity:1;text-wrap:balance}
.go .lk-sub{transition:none}
.lk-sub i{font-style:normal;display:inline-block;opacity:0;filter:blur(7px);transform:translateY(5px)}
.go .lk-sub i{animation:lkWord .8s calc((1.7s + var(--w)*.11s)*var(--tk)) cubic-bezier(.16,1,.3,1) forwards}
@keyframes lkWord{to{opacity:1;filter:none;transform:none}}
#lock.fast .lk-sub i{opacity:1;filter:none;transform:none;animation:none}
.lk-quote{margin-top:20px}
.lk-quote p{font-size:14px}
.lk-quote p span:first-child{color:#d3d7de}.lk-quote p span:last-child{color:#7f8692}

/* the panel is solid black glass now: no blur, because a moving scene behind a blur costs a phone its battery */
.lk-card{background:linear-gradient(180deg,rgba(15,15,18,.93),rgba(5,5,7,.93));-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 30px 80px -30px #000,inset 0 1px 0 rgba(255,255,255,.07)}

/* feedback line */
.lk-disc{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 9px;margin:12px 0 0;padding:0 6px;font-size:12px;line-height:1.4;color:#737a86;text-align:center}
.lk-dc{position:relative;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 10px;border-radius:99px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.045);color:#d6dae1;font:600 12px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.02em;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s,border-color .2s,transform .25s}
.lk-dc::after{content:'';position:absolute;inset:-8px -4px}

    ['Mistakes','FOMO','Revenge trade','Moved my stop','Chased it'],
    ['Emotions','Calm','Patience','Fear','Tilt'],
    ['Rules','Followed plan','Risk 1%','Max 2 trades','No news trades'],
    ['Sessions','NY open','London','NQ','XAUUSD'],
    ['Lessons','Wait for the close','Size down','Review Sunday','Journal it']];
  if(wide) WD.push(['Reviews','Weekly review','Monthly recap','Equity curve','Win rate'],['Goals','Pass the eval','First payout','Consistency','Funded']);

  for(let i=0;i<nd;i++){ const r=wide?14+Math.pow(R(),1.2)*42:13+Math.pow(R(),1.35)*25; dr[i]=r; dt[i]=R()*6.2832; dy[i]=g()*(.8+.05*r); dw[i]=2.6/Math.pow(r,1.5); ds[i]=.5+R()*.8; }
  return {n,X:Float32Array.from(X),Y:Float32Array.from(Y),Z:Float32Array.from(Z),S:Float32Array.from(S),C:Uint8Array.from(C),B,PH,LB,
    nl,La,Lb,Lw,nd,dr,dt,dy,dw,ds,
    arcs:wide?[[31,.35,.4,.5,1.9,.060],[35,-.5,2,2.6,1.5,-.045],[39,.95,3.6,4.1,2.2,.035],[44,-.2,5.2,1.2,1.2,-.03],[27,1.25,1.1,3.3,1.6,.075],[52,.55,1.3,.4,1.7,.04],[58,-.35,4.4,3,1.4,-.03]]:[[31,.35,.4,.5,1.9,.060],[35,-.5,2,2.6,1.5,-.045],[39,.95,3.6,4.1,2.2,.035],[44,-.2,5.2,1.2,1.2,-.03],[27,1.25,1.1,3.3,1.6,.075]],
    neb:wide?[[-18,2,-12,24,255,186,104,.5],[16,-4,12,20,120,150,255,.42],[2,6,26,26,255,206,140,.3],[-26,-10,10,22,120,150,255,.28],[24,12,-14,22,255,186,104,.3]]:[[-13,2,-9,17,255,186,104,.5],[12,-3,10,15,120,150,255,.42],[2,4,22,19,255,206,140,.3]]};
}

/* wide or narrow: sets the class and the numbers the stylesheet uses, and picks the matching scene */
function entMode(early){
  const E=ENT, L=E.lock||$('#lock'); if(!L) return;

  if(wide){
    const ml=Math.round(entClamp(w*.075,52,160)), cw=Math.round(entClamp(w*.29,372,460)), colR=ml+cw;
    const ss=Math.round(entClamp(Math.min(h*.31,(w-colR)*.36),170,300)), hx=Math.round(colR+(w-colR)*.44), hy=Math.round(h*.5);
    st.setProperty('--ml',ml+'px'); st.setProperty('--cw',cw+'px'); st.setProperty('--hx',hx+'px'); st.setProperty('--hy',hy+'px'); st.setProperty('--wss',ss+'px');
    E.colR=colR;
  }else if(E.wide){ ['--ml','--cw','--hx','--hy','--wss'].forEach(k=>st.removeProperty(k)); E.colR=0; }
  L.classList.toggle('wide',wide);
  if(early){ E.wide=wide; return; }          /* the login page only needs the layout class first; the scene is built later */
  const want=wide?(E.scW||(E.scW=entScene(true))):(E.scN||(E.scN=entScene(false)));

  if(wide!==E.wide){ E.wide=wide; E.rz=1; E.W=0; }
}

/* where everything sits on screen: the seal is the centre; the title tells us where the text starts */
function entLayout(force){
  const E=ENT, br=E.bg.getBoundingClientRect(), W=Math.round(br.width), H=Math.round(br.height);

  let dpr=d0*(E.q>.6?1:.75);
  if(E.wide) dpr=Math.min(dpr,Math.sqrt(4.2e6/(W*H)));   /* a big screen: keep the two flat layers at a sane number of pixels */
  if(force||W!==E.W||H!==E.Hh||dpr!==E.dpr){
    E.W=W; E.Hh=H; E.dpr=dpr;
    for(const c of [E.cvA,E.cvB]){ c.width=Math.max(1,Math.round(W*dpr)); c.height=Math.max(1,Math.round(H*dpr)); }
    E.rz=1;

  if(c.replace(/[^0-9A-Z]/g,'').length<12){ $('#err').textContent='Enter your license code.'; return; }
  busy=true; $('#go').disabled=true; $('#go').textContent='Checking…';
  const r=await call('activate',{code:c,device:dev});
  busy=false; $('#go').disabled=false; $('#go').textContent='Activate';
  if(r.net){ $('#err').textContent=ERR.net; return; }
  if(!r.ok){ $('#err').textContent=r.reason==='expired'?`This license ended on ${dateOf(r.exp)}.`:(ERR[r.reason]||ERR.server); return; }
  code=c; await DB.put({license:c,lstate:{ok:true,at:Date.now(),name:r.name,exp:r.exp,grace:r.grace,trial:r.trial}});
  load();
}

/* ---- the entrance: the same black 3D scene as the app ---- */
const GLY='0123456789ABCDEF#%&*+=<>/\\|{}[]';
function buildSeal(){
  const box=$('#lkSeal'); if(!box) return;
  let t='';
  for(let i=0;i<72;i++){
    const a=(i*5-90)*Math.PI/180, mj=i%6===0, r1=mj?83:88, r2=96, c=Math.cos(a), s=Math.sin(a);
    t+=`<line class="sl-t${mj?' mj':''}" style="--i:${i}" x1="${(100+c*r1).toFixed(2)}" y1="${(100+s*r1).toFixed(2)}" x2="${(100+c*r2).toFixed(2)}" y2="${(100+s*r2).toFixed(2)}"/>`;
  }
  box.innerHTML=`<i class="lk-pl" style="--j:0"></i><i class="lk-pl" style="--j:1"></i><i class="lk-pl" style="--j:2"></i>
    <svg viewBox="0 0 200 200" focusable="false" aria-hidden="true"><defs><radialGradient id="slh"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
    <circle class="sl-halo" cx="100" cy="100" r="74" fill="url(#slh)"/><circle class="sl-in" cx="100" cy="100" r="76"/><circle class="sl-arc" cx="100" cy="100" r="76"/>${t}
    <g transform="translate(100 100) scale(1.4) translate(-53.5 -47.5)"><rect class="eb s" x="28" y="26" width="11" height="48"/><rect class="eb b1" x="28" y="26" width="38" height="11"/><rect class="eb b2" x="28" y="44.5" width="29" height="11"/><rect class="eb b3" x="28" y="63" width="38" height="11"/><path class="en" d="M66 37L79 21V37Z"/></g></svg>`;
}
function lightTicks(n){ $$('.sl-t',$('#lkSeal')).forEach((t,i)=>t.classList.toggle('on',i<n)); }
let heroOn=false, introT=0, finT=0, clk=0, draf=0;
const introMode=()=>{ try{ return localStorage.getItem('edge-intro')||'smart'; }catch(e){ return 'smart'; } };
function pickTk(){
  const m=introMode(); if(m==='full') return 1; if(m==='quick') return .38;
  let last=0; try{ last=+localStorage.getItem('edge-intro-at')||0; }catch(e){}
  return Date.now()-last<20*60e3?.38:1;
}
function decTitle(tk){
  const el=$('#lkTitle span'), to='EDGE', f=Math.max(.5,tk), delay=1200*tk, dur=900*f, win=dur*.55, st=(dur-win)/3, t0=performance.now(), salt=Math.random()*99;
  el.textContent=''; cancelAnimationFrame(draf);
  const step=now=>{
    const t=now-t0-delay; if(t<0){ draf=requestAnimationFrame(step); return; }
    const q=Math.floor(now/55); let out='', fin=true;
    for(let i=0;i<4;i++){ if(t>=st*i+win) out+=to[i]; else{ fin=false; const v=Math.sin(i*12.9898+q*78.233+salt)*43758.5453; out+=GLY[((v-Math.floor(v))*GLY.length)|0]; } }
    el.textContent=fin?to:out; if(!fin) draf=requestAnimationFrame(step);
  };
  draf=requestAnimationFrame(step);
}
function finish(){ clearTimeout(finT); cancelAnimationFrame(draf); const el=$('#lkTitle span'); if(el) el.textContent='EDGE'; L.classList.add('fast'); try{ ENT&&ENT.skip(); }catch(e){} }
/* the opening starts when the card is needed. While the app is only being checked, the screen stays quiet black. */
function hero(now){
  if(heroOn) return;
  if(!now){ if(!introT) introT=setTimeout(()=>hero(true),1200); return; }
  clearTimeout(introT); heroOn=true;
  const tk=pickTk(); L.style.setProperty('--tk',tk); L.style.setProperty('--td',tk<1?.45:1);
  L.classList.add('go');
  try{ localStorage.setItem('edge-intro-at',String(Date.now())); }catch(e){}
  if(RM()) finish(); else{ decTitle(tk); finT=setTimeout(finish,tk<1?2100:4400); }
  try{ ENT&&ENT.intro(tk); }catch(e){}
}
/* once the license is good: dive into the hole, then the app takes over (its own opening is the quick one) */
function dive(){
  return new Promise(res=>{
    clearTimeout(introT); clearTimeout(finT);
    if(RM()||!ENT){ res(); return; }
    L.classList.add('fast'); L.classList.remove('busy','err'); void L.offsetWidth; L.classList.add('ok');
    requestAnimationFrame(()=>L.classList.add('opening')); setTimeout(res,1100);
  });
}
function enter(html){ return (heroOn?dive():Promise.resolve()).then(()=>run(html)); }
function shake(){
  try{ ENT&&ENT.err(); }catch(e){}
  L.classList.remove('err'); void L.offsetWidth; L.classList.add('err'); setTimeout(()=>L.classList.remove('err'),950);
  const f=$('#f'); if(f&&f.animate&&!RM()) f.animate([{transform:'translateX(0)'},{transform:'translateX(-10px)'},{transform:'translateX(9px)'},{transform:'translateX(-6px)'},{transform:'translateX(3px)'},{transform:'translateX(0)'}],{duration:480,easing:'cubic-bezier(.36,.07,.19,.97)'});
  try{ navigator.vibrate&&navigator.vibrate([35,45,35]); }catch(e){}
}
function scene(){
  try{ ENT&&ENT.mode&&ENT.mode(); }catch(e){}
  buildSeal();
  const ck=$('#lkClock'), tick=()=>{ const d=new Date(), o=-d.getTimezoneOffset(), z='UTC'+(o>=0?'+':'-')+Math.floor(Math.abs(o)/60)+(Math.abs(o)%60?':'+String(Math.abs(o)%60).padStart(2,'0'):''); ck.textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':')+' · '+z; };
  tick(); clk=setInterval(tick,1000);
  $('#code').addEventListener('input',e=>lightTicks(Math.min(72,Math.round(e.target.value.replace(/[^0-9a-z]/gi,'').length*4.5))));
  new MutationObserver(()=>{ if($('#err').textContent) shake(); }).observe($('#err'),{childList:true,characterData:true,subtree:true});
  L.addEventListener('pointerdown',e=>{ if(heroOn&&!L.classList.contains('fast')&&!e.target.closest('input,button,a,label')) finish(); });
}

(async()=>{
  $('#f').addEventListener('submit',activate); $('#look').addEventListener('click',look); scene();
  if(!window.crypto||!crypto.getRandomValues||!window.indexedDB||!window.fetch){ status('This browser is not supported. Open the link in Safari or Chrome.'); return; }
  try{
    dev=await DB.get('device'); if(!dev){ dev=newDeviceId(); await DB.put({device:dev}); }
    code=(await DB.get('license'))||'';
  }catch(e){ status('Storage is blocked in this browser. Turn off private mode and reload.'); return; }
  if(!code) return ask('none');
  load();
})();
})();
</script>
