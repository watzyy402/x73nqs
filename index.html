<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="edge-loader" content="1">
<meta name="theme-color" content="#111214">
<meta name="robots" content="noindex">
<title>EDGE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111214;color:#f3f4f6;font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:calc(56px + env(safe-area-inset-top)) 24px max(18px,env(safe-area-inset-bottom));overflow-y:auto;background:radial-gradient(60% 40% at 50% 28%,rgba(200,205,214,.13),transparent 70%),#111214}
.mark{width:76px;height:76px;border-radius:24px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);display:grid;place-items:center}
h1{margin:22px 0 0;font-size:56px;letter-spacing:.32em;padding-left:.32em;font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace;background:linear-gradient(180deg,#fff 12%,#8c929c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sub{margin:8px 0 0;color:#9aa0a9}
.st{margin-top:34px;color:#9aa0a9;font-size:14px;display:flex;align-items:center;gap:10px}
.dot{width:7px;height:7px;border-radius:50%;background:#c9cdd3;animation:p 1.1s ease-in-out infinite}
@keyframes p{50%{opacity:.25;transform:scale(.7)}}
.card{width:min(92vw,380px);margin-top:30px;padding:22px;border-radius:24px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.hello{font-size:15px;color:#c9cdd3;margin-bottom:14px;line-height:1.4}
.hello b{color:#fff}
label{display:block;font-size:13px;color:#9aa0a9;margin:0 0 6px 2px;font-weight:600}
input{width:100%;height:50px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;padding:0 16px;font-size:16px;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;outline:0}
input::placeholder{color:#6f757e}
input:focus{border-color:rgba(255,255,255,.7);box-shadow:0 0 0 4px rgba(255,255,255,.12)}
button{width:100%;height:52px;border:0;border-radius:14px;background:#f3f4f6;color:#111214;font-weight:800;font-size:15px;font-family:inherit;margin-top:12px;cursor:pointer}
button:disabled{opacity:.6;pointer-events:none}
.err{min-height:20px;margin-top:10px;font-size:13px;color:#ff7b80;text-align:center}
.foot{margin-top:auto;padding-top:28px;color:#6f757e;font-size:13px;text-align:center}
.foot b{font-family:ui-monospace,Menlo,monospace;letter-spacing:.1em;color:#9aa0a9;margin-left:4px}
.meta{position:fixed;top:max(16px,env(safe-area-inset-top));left:22px;right:22px;display:flex;justify-content:space-between;font:600 10.5px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.24em;color:#6f757e;text-transform:uppercase;pointer-events:none}
.meta i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c9cdd3;margin-right:10px;box-shadow:0 0 10px rgba(255,255,255,.5)}
.sub{font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.34em;text-transform:uppercase;padding-left:.34em}
.quote{margin-top:22px;text-align:center;font-size:16px;line-height:1.4;font-weight:600}
.quote span{display:block;color:#eceef1}.quote span+span{color:#8f95a0}
.ghost{background:transparent;color:#f3f4f6;border:1px solid rgba(255,255,255,.22);margin-top:10px;height:58px;line-height:1.15}
.ghost small{display:block;font-weight:600;font-size:12px;color:#9aa0a9;margin-top:2px}
.or{margin:16px 0 2px;text-align:center;color:#6f757e;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-family:ui-monospace,Menlo,monospace}
.plans{width:min(92vw,380px);margin-top:18px}
.plans h2{margin:0 0 12px;text-align:center;font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.28em;text-transform:uppercase;color:#6f757e}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{position:relative;display:block;padding:16px 14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#f3f4f6;text-decoration:none;text-align:left}
.plan.best{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.09)}
.plan .tg{position:absolute;top:-9px;right:12px;font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;background:#f3f4f6;color:#111214;padding:4px 7px;border-radius:6px}
.plan b{display:block;font-size:14px;color:#c9cdd3;font-weight:700}
.plan .pp{font-size:26px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
.plan small{color:#8f95a0;font-size:12px;line-height:1.3;display:block}
.plan.off{opacity:.5;pointer-events:none}
.pnote{margin:10px 0 0;text-align:center;color:#6f757e;font-size:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="meta"><span><i></i>Members only</span><span>Edge</span></div>
<div class="mark"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#e8eaed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-7 4 4 8-9"/><path d="M15 5h6v6"/></svg></div>
<h1>EDGE</h1>
<p class="sub">Private trading journal</p>
<div class="quote"><span>Stop lying to yourself.</span><span>Trade professionally.</span></div>
<div class="st" id="st"><span class="dot"></span><span id="stt">Starting…</span></div>
<form class="card" id="f" hidden autocomplete="off" novalidate>
  <div class="hello" id="hello"></div>
  <label for="code">License code</label>
  <input id="code" placeholder="EDGE-XXXX-XXXX-XXXX" spellcheck="false" autocapitalize="characters" autocomplete="off" autocorrect="off">
  <button type="submit" id="go">Activate</button>
  <div class="err" id="err"></div>
  <div id="tr"><div class="or">or</div><button type="button" class="ghost" id="look">Take a look<small id="looksub">Free for 3 days. No code, no card.</small></button></div>
</form>
<div class="plans" id="plans" hidden><h2>Get your license</h2><div class="pl" id="pl"></div><p class="pnote" id="pnote"></p></div>
<p class="foot">Created by <b>73NQ</b></p>

<script>
(()=>{'use strict';
const SERVER='https://YOUR-WORKER-ADDRESS';
const $=s=>document.querySelector(s);
const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ', FRESH=36e5; /* within an hour of the last check the saved app starts instantly */
const DB={
  _db:null,
  open(){ if(this._db) return Promise.resolve(this._db); return new Promise((res,rej)=>{ const r=indexedDB.open('edge-journal',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{this._db=r.result;res(r.result)}; r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked')); }); },
  async get(k){ const db=await this.open(); return new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  async put(o){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'),st=tx.objectStore('kv'); for(const k in o) st.put(o[k],k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }
};
function newDeviceId(){ let bits='',out=''; crypto.getRandomValues(new Uint8Array(10)).forEach(x=>{bits+=x.toString(2).padStart(8,'0');}); for(let i=0;i<80;i+=5) out+=B32[parseInt(bits.slice(i,i+5),2)]; return out; }
async function call(path,body,ms){
  const ac=new AbortController(), t=setTimeout(()=>ac.abort(),ms||8000);
  try{ const r=await fetch(SERVER+'/api/'+path,{method:'POST',headers:{'content-type':'text/plain'},body:JSON.stringify(body),signal:ac.signal}); if(r.status>=500) return {net:true}; return await r.json(); }
  catch(e){ return {net:true}; } finally{ clearTimeout(t); }
}
const dateOf=ms=>new Date(ms).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const HELLO={
  none:'Activate EDGE.<br>Enter the license code you got after payment.',
  offline:"Can't reach the license server.<br>Connect to the internet to check your license.",
  device:'This phone is no longer linked to your license.<br>Tap Activate to link it again.',
  revoked:'This license has been cancelled.<br>Contact the seller.',
  unknown:'This license no longer exists.<br>Contact the seller.',
  noapp:'EDGE is being updated.<br>Please try again in a few minutes.',
  server:'Could not check your license.<br>Try again in a moment.',
  format:'Enter the license code you got after payment.'
};
const ERR={format:"That doesn't look like a license code.",unknown:"That code doesn't exist. Check it and try again.",revoked:'This license has been cancelled.',device:'This code is already used on another phone. Ask the seller to free it.',net:"Can't reach the license server. Check your internet and try again.",server:'Something went wrong on the server. Try again soon.',noapp:'EDGE is being updated. Try again in a few minutes.',trialused:'Your free look has already been used. Pick a plan below.',trialip:'Free looks from this connection are used up. Pick a plan below.'};
let dev='', code='', busy=false;

const DEF_PLANS={trialDays:3,plans:[{id:'3m',name:'3 months',price:'59.99',note:'One payment, 3 months of access',url:''},{id:'life',name:'Lifetime',price:'104.99',note:'Pay once, keep it for good',best:1,url:''}]};
let PLANS=null;
async function getPlans(){
  if(PLANS) return PLANS;
  try{ const ac=new AbortController(), t=setTimeout(()=>ac.abort(),5000); const r=await fetch(SERVER+'/api/plans',{signal:ac.signal}); clearTimeout(t); const j=await r.json(); PLANS=j&&j.ok&&j.plans?j:DEF_PLANS; }catch(e){ PLANS=DEF_PLANS; }
  return PLANS;
}
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function showPlans(){
  const P=await getPlans();
  $('#pl').innerHTML=P.plans.map(p=>`<a class="plan ${p.best?'best':''} ${p.url?'':'off'}" ${p.url?`href="${esc(p.url)}" target="_blank" rel="noopener"`:''}>${p.best?'<span class="tg">Best value</span>':''}<b>${esc(p.name)}</b><div class="pp">$${esc(p.price)}</div><small>${esc(p.note||'')}</small></a>`).join('');
  $('#pnote').textContent=P.plans.some(p=>p.url)?'After you pay, you get your license code. Enter it above.':'Payment links are not set up yet. Contact the seller.';
  $('#plans').hidden=false;
  $('#looksub').textContent='Free for '+(P.trialDays||3)+' days. No code, no card.';
}
function status(t){ $('#f').hidden=true; $('#st').hidden=false; $('#stt').textContent=t; }
function ask(why,exp,btn){
  $('#st').hidden=true; $('#f').hidden=false; $('#err').textContent='';
  const wasTrial=!!window.__trialEnded;
  $('#hello').innerHTML=why==='expired'?(wasTrial?`Your free look ended on <b>${dateOf(exp)}</b>.<br>Pick a plan below, then enter your code.`:`Your license ended on <b>${dateOf(exp)}</b>.<br>Get it renewed, then tap Activate.`):(HELLO[why]||HELLO.none);
  $('#tr').hidden=!((why==='none'||why==='unknown')&&!wasTrial);
  if(why==='none'||why==='expired'||why==='unknown'||why==='trialused') showPlans(); else $('#plans').hidden=true;
  $('#code').value=code||''; $('#go').textContent=btn||(why==='offline'?'Try again':'Activate'); $('#go').disabled=false;
}
function run(html){ document.open(); document.write(html); document.close(); }

/* Gets the app from the server. The server only sends it to a valid, linked license. */
async function load(){
  status('Checking your license…');
  let cached=null, st=null;
  try{ cached=await DB.get('appcode'); st=await DB.get('lstate'); }catch(e){}
  window.__trialEnded=!!(st&&st.trial);
  const now=Date.now(), good=!!(cached&&cached.html&&st&&st.ok&&now>=st.at&&!(st.exp&&now>st.exp));
  const refresh=async()=>{
    const r=await call('app',{code,device:dev,have:cached&&cached.ver});
    if(r.net) return r;
    if(r.ok){ await DB.put({lstate:{ok:true,at:Date.now(),name:r.name,exp:r.exp,grace:r.grace,trial:r.trial}}); if(r.html) await DB.put({appcode:{ver:r.ver,html:r.html}}); }
    else await DB.put({lstate:{ok:false,at:Date.now(),reason:r.reason}});
    return r;
  };
  if(good&&now-st.at<FRESH){ run(cached.html); return; }
  const r=await refresh();
  if(r.net){
    if(good&&now-st.at<(st.grace||7)*864e5){ run(cached.html); return; }
    return ask('offline');
  }
  if(r.ok){ const html=r.html||(cached&&cached.html); if(html){ run(html); return; } }
  ask(r.reason||'server',r.exp);
}

async function look(){
  if(busy) return; busy=true; const b=$('#look'); b.disabled=true; $('#err').textContent='';
  const r=await call('trial',{device:dev},10000);
  busy=false; b.disabled=false;
  if(r.net){ $('#err').textContent=ERR.net; return; }
  if(!r.ok){ $('#err').textContent=ERR[r.reason]||ERR.server; if(r.reason==='trialused'||r.reason==='trialip') $('#tr').hidden=true; showPlans(); return; }
  code=String(r.code||''); await DB.put({license:code,lstate:{ok:true,at:Date.now(),name:r.name,exp:r.exp,grace:r.grace,trial:1}});
  load();
}
async function activate(e){
  e.preventDefault(); if(busy) return;
  const c=$('#code').value.replace(/\s+/g,'').toUpperCase();
  if(c.replace(/[^0-9A-Z]/g,'').length<12){ $('#err').textContent='Enter your license code.'; return; }
  busy=true; $('#go').disabled=true; $('#go').textContent='Checking…';
  const r=await call('activate',{code:c,device:dev});
  busy=false; $('#go').disabled=false; $('#go').textContent='Activate';
  if(r.net){ $('#err').textContent=ERR.net; return; }
  if(!r.ok){ $('#err').textContent=r.reason==='expired'?`This license ended on ${dateOf(r.exp)}.`:(ERR[r.reason]||ERR.server); return; }
  code=c; await DB.put({license:c,lstate:{ok:true,at:Date.now(),name:r.name,exp:r.exp,grace:r.grace,trial:r.trial}});
  load();
}

(async()=>{
  $('#f').addEventListener('submit',activate); $('#look').addEventListener('click',look);
  if(!window.crypto||!crypto.getRandomValues||!window.indexedDB||!window.fetch){ status('This browser is not supported. Open the link in Safari or Chrome.'); return; }
  try{
    dev=await DB.get('device'); if(!dev){ dev=newDeviceId(); await DB.put({device:dev}); }
    code=(await DB.get('license'))||'';
  }catch(e){ status('Storage is blocked in this browser. Turn off private mode and reload.'); return; }
  if(!code) return ask('none');
  load();
})();
})();
</script>
</body>
</html>
